[project]
name = "team-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "passlib>=1.7.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "testcontainers[postgres]>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[tool.pyright]
extraPaths = ["src", "src/apps"]

[tool.mypy]
mypy_path = "src:src/apps"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src", "src/apps"]

[tool.coverage.run]
source = ["src"]
